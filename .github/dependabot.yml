version: 2

# 依赖更新策略
#
# 目标：把“依赖落后 250 个模块、40+ 直接依赖”这类漂移变成持续的小批量更新，
# 而不是攒到需要一次性 `go get -u all`。
#
# 分组理由：后端 provider 相关依赖（AWS SDK、阿里云、腾讯云）经常同批发布，
# 拆成独立 PR 会造成大量互相冲突的手动 rebase。

updates:
  # ---------- 后端 Go ----------
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - backend
    groups:
      # x/* 官方扩展库：通常只有补丁级差异，可整批验证
      golang-x:
        patterns:
          - "golang.org/x/*"
      # 云厂商 SDK：同步发布，单独成组避免互相冲突
      cloud-sdk:
        patterns:
          - "github.com/aws/aws-sdk-go-v2*"
          - "github.com/tencentcloud/tencentcloud-sdk-go*"
          - "github.com/alibabacloud-go/*"
          - "github.com/aliyun/*"
      # 测试与可观测性
      tooling:
        patterns:
          - "github.com/stretchr/testify"
          - "go.uber.org/zap"
          - "github.com/shirou/gopsutil*"
      # 其余非主版本更新合并为一个 PR
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # gin 1.10+ 改动 Context 内部结构与部分中间件签名，涉及 238 个测试文件，
      # 必须人工升级并跑全量回归，不让机器人自动提 PR。
      - dependency-name: "github.com/gin-gonic/gin"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  # ---------- 前端 ----------
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - frontend
    groups:
      vue-ecosystem:
        patterns:
          - "vue"
          - "vue-*"
          - "@vue/*"
          - "pinia"
          - "vue-router"
          - "vue-i18n"
          - "@intlify/*"
      vite-build:
        patterns:
          - "vite"
          - "vite-*"
          - "@vitejs/*"
          - "rolldown"
          - "@rolldown/*"
          - "typescript"
          - "vue-tsc"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "jsdom"
          - "@vue/test-utils"
          - "@playwright/test"
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "typescript-eslint"
          - "globals"
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # jsdom 24 → 31 会改变 window.location 等 DOM 行为，直接影响 9 个
      # 依赖 Object.defineProperty(window,'location') 的测试文件，需人工迁移。
      - dependency-name: "jsdom"
        update-types:
          - "version-update:semver-major"

  # ---------- 桌面端 ----------
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - desktop
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /desktop/src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - desktop
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # ---------- CI Actions ----------
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
      - ci

  # ---------- Docker 基础镜像 ----------
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
      - docker
