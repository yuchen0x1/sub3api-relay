version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: "gomod"
    directory: "/backend"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
