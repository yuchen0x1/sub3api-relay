name: "CLA Assistant"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, closed, synchronize]

# 默认最小权限；各 job 按需声明。
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  cla-check:
    if: |
      github.repository == 'yuchen0x1/sub3api-relay' &&
      (
        github.event_name == 'issue_comment' ||
        (github.event_name == 'pull_request_target' && github.event.action != 'closed')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write        # 提交签名文件到 cla-signatures 分支
      issues: write          # issue_comment 场景回复签名评论
      pull-requests: write   # 在 PR 上评论签名状态
      statuses: write
    steps:
      - name: "CLA Assistant"
        if: |
          (github.event.comment.body == 'recheck' ||
           github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
          github.event_name == 'pull_request_target'
        # 供应链加固：第三方 action 固定到 v2.6.1 对应的 commit SHA。
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "cla.json"
          path-to-document: "https://github.com/yuchen0x1/sub3api-relay/blob/codex/upgrade-analysis-r1-4/CLA.md"
          branch: "cla-signatures"
          allowlist: "dependabot[bot],renovate[bot],bot*"
          lock-pullrequest-aftermerge: false
          custom-notsigned-prcomment: |
            Thank you for your contribution! Before we can merge this PR, we need $you to sign our [Contributor License Agreement (CLA)](https://github.com/yuchen0x1/sub3api-relay/blob/codex/upgrade-analysis-r1-4/CLA.md).

            **To sign**, please reply with the following comment:

            > I have read the CLA Document and I hereby sign the CLA

            You only need to sign once — it will be valid for all your future contributions to this project.
          custom-pr-sign-comment: "I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: "All contributors have signed the CLA. ✅"

  cla-lock:
    if: |
      github.repository == 'yuchen0x1/sub3api-relay' &&
      github.event_name == 'pull_request_target' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write        # 锁定已合并 PR
      pull-requests: write
    steps:
      - name: "Lock merged PR"
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: "cla.json"
          path-to-document: "https://github.com/yuchen0x1/sub3api-relay/blob/codex/upgrade-analysis-r1-4/CLA.md"
          branch: "cla-signatures"
          lock-pullrequest-aftermerge: true
