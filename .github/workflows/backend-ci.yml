name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Check deployment scripts
        env:
          ADMIN_PASSWORD: ReleaseTest-Only-2026!
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
          /bin/sh deploy/tests/docker-runtime-resources-test.sh
          /bin/sh deploy/test-caddyfile-cache.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.26.10'
      - name: Check installer and Docker deployment security
        run: |
          /bin/bash deploy/tests/install-setup-security-test.sh
          /bin/bash deploy/tests/install-github-token-test.sh
          /bin/bash deploy/tests/docker-deploy-security-test.sh
      - name: Unit tests
        working-directory: backend
        run: make test-unit
      - name: Integration tests
        working-directory: backend
        run: make test-integration

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.26.10'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9
          args: --timeout=30m
          working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.20.0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Lint
        run: pnpm --dir frontend lint:check
      - name: Typecheck
        run: pnpm --dir frontend typecheck
      # 前端测试已修复环境 teardown 问题（根因：AccountsView 的
      # defineAsyncComponent 弹窗在 mount 时即加载，而测试只 mock 了
      # useI18n 未安装 i18n 插件，导致异常发生在 jsdom 销毁之后）。
      # 现在全量 226 个文件 / 1538 个用例 0 错误，作为硬门禁执行。
      - name: Unit tests
        run: pnpm --dir frontend exec vitest run
