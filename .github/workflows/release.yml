name: Release build and publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to validate and build (e.g., v0.3.1); manual runs do not publish a release"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  ci:
    if: github.event_name == 'push'
    uses: ./.github/workflows/backend-ci.yml

  security:
    if: github.event_name == 'push'
    uses: ./.github/workflows/security-scan.yml

  build-and-validate:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

      - name: Validate release metadata
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version tag: $RELEASE_TAG (expected vX.Y.Z)" >&2
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          NOTES="docs/release-notes/RELEASE_NOTES_${RELEASE_TAG}.md"
          test "$(tr -d '\r\n' < backend/cmd/server/VERSION)" = "$VERSION"
          test "$(node -p "require('./frontend/package.json').version")" = "$VERSION"
          test -s "$NOTES"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            git merge-base --is-ancestor HEAD origin/main
          fi
          echo "Validated $RELEASE_TAG. Tag-triggered runs publish the GitHub Release after the assets pass validation."

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify Go version
        run: go version | grep -q 'go1.26.11'

      - name: Check reachable Go vulnerabilities before release
        working-directory: backend
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          status=0
          govulncheck -format json ./... > govulncheck.json || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
            echo "govulncheck failed with exit code $status" >&2
            exit "$status"
          fi
          python3 scripts/check-govuln-report.py govulncheck.json

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
        with:
          version: 11.20.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend for embedded release
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend build

      - name: Build platform archives and release bundles
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          mkdir -p release-assets
          RELEASE_ASSETS_DIR="$PWD/release-assets"
          RELEASE_COMMIT="$(git rev-parse HEAD)"
          RELEASE_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64 freebsd/amd64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            name="sub3api_${VERSION}_${GOOS}_${GOARCH}"
            output="$RELEASE_ASSETS_DIR/$name"
            if [ "$GOOS" = windows ]; then output="$output.exe"; fi
            (cd backend && CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -tags embed -ldflags="-s -w -X main.Version=$VERSION -X main.Commit=$RELEASE_COMMIT -X main.Date=$RELEASE_DATE -X main.BuildType=release" -o "$output" ./cmd/server)
            stage=$(mktemp -d)
            if [ "$GOOS" = windows ]; then cp "$output" "$stage/sub3api.exe"; else cp "$output" "$stage/sub3api"; fi
            tar -C "$stage" -czf "$RELEASE_ASSETS_DIR/${name}.tar.gz" .
            rm -rf "$stage" "$output"
          done
          tar -C backend/internal/web/dist -czf "$RELEASE_ASSETS_DIR/sub3api_${VERSION}_web.tar.gz" .
          deploy_bundle=$(mktemp -d)
          cp deploy/install.sh deploy/docker-deploy.sh deploy/docker-compose.local.yml "$deploy_bundle/"
          cp deploy/.env.example "$deploy_bundle/sub3api.env.example"
          (
            cd "$deploy_bundle"
            sha256sum install.sh docker-deploy.sh docker-compose.local.yml sub3api.env.example > deploy-checksums.txt
            tar -czf "$RELEASE_ASSETS_DIR/sub3api_${VERSION}_deploy.tar.gz" .
          )
          rm -rf "$deploy_bundle"
          (cd release-assets && sha256sum sub3api_*.tar.gz > checksums.txt)
          printf 'Built local CI assets in release-assets/:\n'
          ls -1 release-assets
          printf 'Built release assets for %s. A tag-triggered run publishes them below; manual runs remain validation-only.\n' "$RELEASE_TAG"

      - name: Verify archive checksums and Linux executable
        run: |
          cd release-assets
          sha256sum --strict --check checksums.txt
          tar -xOzf "sub3api_${RELEASE_TAG#v}_linux_amd64.tar.gz" ./sub3api > "$RUNNER_TEMP/sub3api"
          chmod +x "$RUNNER_TEMP/sub3api"
          "$RUNNER_TEMP/sub3api" -version 2>&1 | grep -F "Sub3API ${RELEASE_TAG#v} ("

      - name: Exercise Linux systemd update and rollback
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash deploy/tests/update-service-test.sh release-assets "${RELEASE_TAG#v}"

      - name: Upload build artifacts to workflow run
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sub3api-${{ env.RELEASE_TAG }}-release-assets
          path: release-assets/*
          if-no-files-found: error


  smoke:
    needs: build-and-validate
    strategy:
      matrix:
        include:
          - { runner: windows-latest, target: windows_amd64, binary: sub3api.exe }
          - { runner: macos-15, target: darwin_arm64, binary: sub3api }
          - { runner: ubuntu-24.04-arm, target: linux_arm64, binary: sub3api }
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: sub3api-${{ env.RELEASE_TAG }}-release-assets
      - name: Run packaged binary on matching host
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf "sub3api_${RELEASE_TAG#v}_${{ matrix.target }}.tar.gz"
          "./${{ matrix.binary }}" -version 2>&1 | grep -F "Sub3API ${RELEASE_TAG#v} ("

  image:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-latest, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Build and start the runtime image
        run: |
          set -euo pipefail
          docker build --build-arg VERSION="${RELEASE_TAG#v}" --build-arg COMMIT="$(git rev-parse HEAD)" \
            --build-arg GOPROXY=https://proxy.golang.org,direct --build-arg GOSUMDB=sum.golang.org -t sub3api:ci .
          docker run --rm sub3api:ci -version 2>&1 | grep -F "Sub3API ${RELEASE_TAG#v} ("
          docker run -d --name smoke -p 127.0.0.1:18080:8080 sub3api:ci
          curl --retry 20 --retry-all-errors --retry-delay 1 -fsS http://127.0.0.1:18080/health
          docker stop smoke
          docker save sub3api:ci | gzip -1 > "$RUNNER_TEMP/image.tar.gz"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: image-${{ matrix.arch }}
          path: ${{ runner.temp }}/image.tar.gz
          compression-level: 0
          retention-days: 2

  publish:
    if: github.event_name == 'push'
    needs: [ci, security, smoke, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: sub3api-${{ env.RELEASE_TAG }}-release-assets
          path: release-assets
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: image-*
          path: images
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: 'release-assets/*'
      - name: Publish tested image manifest and release
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          refs=()
          for arch in amd64 arm64; do
            docker load -i "images/image-$arch/image.tar.gz"
            ref="$IMAGE:$GITHUB_SHA-$arch"
            docker tag sub3api:ci "$ref"
            docker push "$ref"
            refs+=("$ref")
          done
          docker buildx imagetools create -t "$IMAGE:$RELEASE_TAG" -t "$IMAGE:${RELEASE_TAG#v}" "${refs[@]}"
          docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG"
          gh release create "$RELEASE_TAG" --verify-tag --title "Sub3API $RELEASE_TAG" \
            --notes-file "docs/release-notes/RELEASE_NOTES_$RELEASE_TAG.md" release-assets/*
          if [[ "$(gh release view --json tagName --jq .tagName)" == "$RELEASE_TAG" ]]; then
            docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:$RELEASE_TAG"
          fi
