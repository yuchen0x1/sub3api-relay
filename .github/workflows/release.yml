name: Release build and publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to validate and build (e.g., v0.3.1); manual runs do not publish a release"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

      - name: Validate release metadata
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version tag: $RELEASE_TAG (expected vX.Y.Z)" >&2
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"
          NOTES="docs/release-notes/RELEASE_NOTES_${RELEASE_TAG}.md"
          test "$(tr -d '\r\n' < backend/cmd/server/VERSION)" = "$VERSION"
          test "$(node -p "require('./frontend/package.json').version")" = "$VERSION"
          test -s "$NOTES"
          echo "Validated $RELEASE_TAG. Tag-triggered runs publish the GitHub Release after the assets pass validation."

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify Go version
        run: go version | grep -q 'go1.26.10'

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend for embedded release
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend build

      - name: Build platform archives and release bundles
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          mkdir -p release-assets
          RELEASE_ASSETS_DIR="$PWD/release-assets"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64 freebsd/amd64; do
            GOOS="${target%/*}"
            GOARCH="${target#*/}"
            name="sub3api_${VERSION}_${GOOS}_${GOARCH}"
            output="$RELEASE_ASSETS_DIR/$name"
            if [ "$GOOS" = windows ]; then output="$output.exe"; fi
            (cd backend && CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -tags embed -ldflags="-X main.Version=$VERSION" -o "$output" ./cmd/server)
            stage=$(mktemp -d)
            if [ "$GOOS" = windows ]; then cp "$output" "$stage/sub3api.exe"; else cp "$output" "$stage/sub3api"; fi
            tar -C "$stage" -czf "$RELEASE_ASSETS_DIR/${name}.tar.gz" .
            rm -rf "$stage" "$output"
          done
          (cd release-assets && sha256sum sub3api_*.tar.gz > checksums.txt)
          tar -C backend/internal/web/dist -czf "$RELEASE_ASSETS_DIR/sub3api_${VERSION}_web.tar.gz" .
          deploy_bundle=$(mktemp -d)
          cp deploy/install.sh deploy/docker-deploy.sh deploy/docker-compose.local.yml "$deploy_bundle/"
          cp deploy/.env.example "$deploy_bundle/sub3api.env.example"
          (
            cd "$deploy_bundle"
            sha256sum install.sh docker-deploy.sh docker-compose.local.yml sub3api.env.example > deploy-checksums.txt
            tar -czf "$RELEASE_ASSETS_DIR/sub3api_${VERSION}_deploy.tar.gz" .
          )
          rm -rf "$deploy_bundle"
          printf 'Built local CI assets in release-assets/:\n'
          ls -1 release-assets
          printf 'Built release assets for %s. A tag-triggered run publishes them below; manual runs remain validation-only.\n' "$RELEASE_TAG"

      - name: Build container image (no push)
        run: |
          docker buildx build --platform linux/amd64 --load \
            --tag "sub3api:${RELEASE_TAG#v}-ci" \
            --build-arg VERSION="${RELEASE_TAG#v}" .

      - name: Upload build artifacts to workflow run
        uses: actions/upload-artifact@v6
        with:
          name: sub3api-${{ env.RELEASE_TAG }}-release-assets
          path: release-assets/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Sub3API ${{ env.RELEASE_TAG }}
          body_path: docs/release-notes/RELEASE_NOTES_${{ env.RELEASE_TAG }}.md
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

