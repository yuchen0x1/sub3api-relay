name: Branch governance

on:
  schedule:
    - cron: '23 1 * * 1'
  pull_request:
    paths:
      - '.github/workflows/branch-governance.yml'
      - '.github/scripts/branch-governance.py'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      draft_branch:
        description: 'Existing branch to open a draft PR for (optional)'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Report branch status
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 .github/scripts/branch-governance.py >> "$GITHUB_STEP_SUMMARY"

  draft:
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.draft_branch != ''
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: branch-governance-drafts
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Open draft for reviewed branch
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DRAFT_BRANCH: ${{ inputs.draft_branch }}
        run: python3 .github/scripts/branch-governance.py --draft "$DRAFT_BRANCH" >> "$GITHUB_STEP_SUMMARY"
