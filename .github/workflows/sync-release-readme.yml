name: Sync release to README

on:
  release:
    types: [published, edited, released, unpublished, deleted]
  workflow_dispatch:
  workflow_run:
    workflows: ["Release build and publish"]
    types: [completed]
  # Catch releases published by another workflow using GITHUB_TOKEN and missed events.
  schedule:
    - cron: '36 3 * * *'

permissions:
  contents: read

concurrency:
  group: sync-release-readme
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch' || github.event.workflow_run.event == 'workflow_call'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # API-only: never check out or execute release/PR content with this token.
      - name: Update README on a maintenance branch and open or reuse a PR
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          retries: 3
          script: |
            const { owner, repo } = context.repo
            const branch = 'automation/sync-release-readme'
            const defaultBranch = context.payload.repository.default_branch
            if (branch === defaultBranch) throw new Error('Maintenance branch must differ from the default branch')
            const start = '<!-- github-release:start -->'
            const end = '<!-- github-release:end -->'
            const releases = 'https://github.com/' + owner + '/' + repo + '/releases'

            function plain(text) {
              return text.replace(/!\[[^\]]*\]\([^)]*\)/g, '')
                .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
                .replace(/(\*\*|__|\x60)/g, '').replace(/\s+/g, ' ').trim()
            }

            function escapeMarkdown(text) {
              return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/[\\*_[\]\x60#|!~]/g, '\\$&')
            }

            function summary(body) {
              const lines = (body || '').replace(/\r/g, '').split('\n')
              const index = lines.findIndex(line => /^#{1,4} .*(版本概述|Release overview|Summary)\s*$/i.test(line))
              const following = index < 0 ? [] : lines.slice(index + 1)
              while (following.length && !following[0].trim()) following.shift()
              const paragraph = []
              for (const line of following) {
                if (!line.trim() || /^[#|]|^\s*(?:---|\x60\x60\x60)/.test(line)) break
                paragraph.push(line.trim())
              }
              const fallback = lines.find(line => /^[-*>] \S/.test(line) && !/^[-*>] [![]/.test(line))
              const excerpt = plain(paragraph.join(' ') || (fallback || '').replace(/^[-*>] /, ''))
              if (!excerpt) return ''
              const chars = Array.from(excerpt)
              return escapeMarkdown(chars.length > 330 ? chars.slice(0, 327).join('') + '…' : excerpt)
            }

            let latest
            try {
              latest = (await github.rest.repos.getLatestRelease({ owner, repo })).data
            } catch (error) {
              if (error.status !== 404) throw error
            }

            async function readReadme(ref) {
              const file = (await github.rest.repos.getContent({ owner, repo, path: 'README.md', ref })).data
              if (Array.isArray(file) || file.type !== 'file' || file.encoding !== 'base64') {
                throw new Error('Expected README.md to be a base64-encoded file')
              }
              return Buffer.from(file.content, 'base64').toString('utf8')
            }

            function render(before) {
              const first = before.indexOf(start)
              const last = before.indexOf(end)
              if (first < 0 || last < first || first !== before.lastIndexOf(start) || last !== before.lastIndexOf(end)) {
                throw new Error('Expected one github-release marker pair in README.md')
              }
              const english = /^## Latest release\s*$/im.test(before)
              const history = english ? 'Release history' : '全部发行记录'
              const lines = ['[' + history + '](' + releases + ')']
              if (latest) {
                const label = escapeMarkdown(latest.tag_name)
                const url = releases + '/tag/' + encodeURIComponent(latest.tag_name)
                if (!/^\d{4}-\d{2}-\d{2}T/.test(latest.published_at || '')) throw new Error('Invalid publication date')
                lines.unshift('**[' + label + '](' + url + ')** · ' + latest.published_at.slice(0, 10))
                const overview = summary(latest.body)
                if (overview) lines.splice(1, 0, overview)
              } else {
                lines.unshift(english ? 'No published stable release.' : '尚无已发布的正式版本。')
              }
              const nl = before.includes('\r\n') ? '\r\n' : '\n'
              return before.slice(0, first + start.length) + nl + nl + lines.join(nl + nl) + nl + nl + before.slice(last)
            }

            const base = (await github.rest.git.getRef({ owner, repo, ref: `heads/${defaultBranch}` })).data.object.sha
            const before = await readReadme(base)
            const after = render(before)
            if (after === before) {
              core.info('README already matches the latest stable release; no commit or PR is needed.')
              return
            }

            // This maintenance branch only owns the README release marker block.
            // Rebuild it from the current default branch on every run: stacking
            // commits on the previous branch head leaves the open PR permanently
            // conflicted once main advances. Force-updating is safe here because
            // manual edits on this automation branch are not part of the contract.
            const baseCommit = (await github.rest.git.getCommit({ owner, repo, commit_sha: base })).data
            const blob = (await github.rest.git.createBlob({ owner, repo, content: after, encoding: 'utf-8' })).data
            const tree = (await github.rest.git.createTree({
              owner, repo, base_tree: baseCommit.tree.sha,
              tree: [{ path: 'README.md', mode: '100644', type: 'blob', sha: blob.sha }]
            })).data
            const next = (await github.rest.git.createCommit({
              owner, repo, message: 'docs: sync README with GitHub Releases', tree: tree.sha, parents: [base]
            })).data

            let head
            try {
              head = (await github.rest.git.getRef({ owner, repo, ref: `heads/${branch}` })).data.object.sha
            } catch (error) {
              if (error.status !== 404) throw error
            }
            if (head) {
              await github.rest.git.updateRef({ owner, repo, ref: `heads/${branch}`, sha: next.sha, force: true })
            } else {
              await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${branch}`, sha: next.sha })
            }

            const open = (await github.rest.pulls.list({ owner, repo, state: 'open', base: defaultBranch, head: `${owner}:${branch}` })).data[0]
            if (open) {
              core.info(`Reusing README synchronization PR #${open.number}: ${open.html_url}`)
              return
            }
            const comparison = (await github.rest.repos.compareCommitsWithBasehead({
              owner, repo, basehead: `${defaultBranch}...${branch}`
            })).data
            if (comparison.ahead_by === 0 || comparison.files.length === 0) {
              core.info('Maintenance branch has no changes; no PR is needed.')
              return
            }
            try {
              const pr = (await github.rest.pulls.create({
                owner, repo, base: defaultBranch, head: branch,
                title: 'docs: sync README with GitHub Releases',
                body: 'Updates the README latest-release section from the latest published stable GitHub Release. Review the diff and pass all required checks before merging. If GITHUB_TOKEN does not trigger checks, a maintainer must close and reopen this PR with their own account.'
              })).data
              core.info(`Created README synchronization PR #${pr.number}: ${pr.html_url}`)
            } catch (error) {
              if (error.status !== 422) throw error
              const raced = (await github.rest.pulls.list({ owner, repo, state: 'open', base: defaultBranch, head: `${owner}:${branch}` })).data[0]
              if (!raced) throw error
              core.info(`Another run created README synchronization PR #${raced.number}: ${raced.html_url}`)
            }
