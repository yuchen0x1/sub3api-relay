name: Security Scan

on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # 全量历史扫描：泄漏过的密钥即使已在后续提交删除也会被发现。
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 仓库根的 .gitleaks.toml 会按值豁免已人工核实的误报
          # （公开 OAuth 客户端凭据、测试占位值、规则误判的标识符）。
          # 未显式传入时 gitleaks-action 也会自动发现该文件；
          # 这里显式指定，避免 action 版本变化后静默回退到默认规则。
          GITLEAKS_CONFIG: ${{ github.workspace }}/.gitleaks.toml

  backend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.26.10'
      - name: Run govulncheck
        working-directory: backend
        run: |
          # 固定工具版本，避免 CI 中执行未审计的 @latest 代码。
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          status=0
          govulncheck -format json ./... > govulncheck.json || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 3 ]; then
            echo "govulncheck failed with exit code $status" >&2
            exit "$status"
          fi
          python3 scripts/check-govuln-report.py govulncheck.json
