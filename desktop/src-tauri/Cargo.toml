[package]
name = "sub3api-cockpit"
version = "0.1.0"
description = "Sub3API desktop control plane"
authors = ["Sub3API contributors"]
edition = "2021"

[lib]
name = "sub3api_cockpit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
